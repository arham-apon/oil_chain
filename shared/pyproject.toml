[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsp-shared"
version = "0.1.0"
description = "Shared library for the Fuel Supply Operations Platform services"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31",
  "redis>=5",
  "structlog>=25",
  "prometheus-client>=0.20",
  "fastapi>=0.115",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "fakeredis", "ruff", "mypy", "alembic", "psycopg2-binary"]

[tool.setuptools.packages.find]
include = ["fsp_shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
