server {
  listen 3000;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://gateway-svc:8080; proxy_read_timeout 60s; }
  location /ws { proxy_pass http://gateway-svc:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  location / { try_files $uri /index.html; }
}
