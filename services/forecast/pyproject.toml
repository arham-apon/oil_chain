[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsp-forecast"
version = "0.1.0"
description = "Forecast service: scikit-learn Ridge demand models, time-to-empty and stockout risk"
requires-python = ">=3.12"
dependencies = [
  "fsp-shared",
  "uvicorn[standard]>=0.30",
  "numpy>=2",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
