[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsp-gateway"
version = "0.1.0"
description = "Gateway (BFF): REST + WebSocket API for the operator UI, health console, demo controls"
requires-python = ">=3.12"
dependencies = [
  "fsp-shared",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
