[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsp-cognitive"
version = "0.1.0"
description = "Cognitive service: Gemini (LangChain) explanations, incident briefs, operator copilot"
requires-python = ">=3.12"
dependencies = [
  "fsp-shared",
  "uvicorn[standard]>=0.30",
  "langchain-core",
  "langchain-google-genai",
  "langchain-groq",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
