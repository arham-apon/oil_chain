services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    container_name: bup-simulator-api
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "8000:8000"
    networks: [fuel-net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback on a non-default host port so it never clashes with a local PostgreSQL on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fuel-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks: [fuel-net]
    restart: unless-stopped

  ingestion-svc:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    env_file: .env
    environment:
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      simulator-api:
        condition: service_started
    ports:
      - "${INGESTION_HOST_PORT:-8101}:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [fuel-net]
    restart: unless-stopped

  forecast-svc:
    build:
      context: .
      dockerfile: services/forecast/Dockerfile
    env_file: .env
    environment:
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /models
    volumes:
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${FORECAST_HOST_PORT:-8102}:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8102/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [fuel-net]
    restart: unless-stopped

  decision-svc:
    build:
      context: .
      dockerfile: services/decision/Dockerfile
    env_file: .env
    environment:
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      FORECAST_URL: http://forecast-svc:8102
      COGNITIVE_URL: http://cognitive-svc:8104
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      simulator-api:
        condition: service_started
    ports:
      - "${DECISION_HOST_PORT:-8103}:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8103/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [fuel-net]
    restart: unless-stopped

  cognitive-svc:
    build:
      context: .
      dockerfile: services/cognitive/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      FORECAST_URL: http://forecast-svc:8102
      DECISION_URL: http://decision-svc:8103
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COGNITIVE_HOST_PORT:-8104}:8104"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8104/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [fuel-net]
    restart: unless-stopped

  gateway-svc:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [fuel-net]
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    depends_on: [gateway-svc]
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks: [fuel-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [fuel-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    networks: [fuel-net]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # host port 8081 is inside the Windows/Hyper-V reserved range on the dev machine (DECISIONS D13)
    ports:
      - "${CADVISOR_HOST_PORT:-18081}:8080"
    networks: [fuel-net]
    restart: unless-stopped

networks:
  fuel-net:
    driver: bridge

volumes:
  pgdata:
  models:
