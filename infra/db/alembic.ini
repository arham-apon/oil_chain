# CLI use:  alembic -c infra/db/alembic.ini upgrade head   (needs DATABASE_URL in the environment)
# The platform itself runs migrations programmatically via fsp_shared.migrate (ingestion-svc).
[alembic]
script_location = %(here)s
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
