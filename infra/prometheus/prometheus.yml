global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fsp-services
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-svc:8101"]
        labels: {service: ingestion-svc}
      - targets: ["forecast-svc:8102"]
        labels: {service: forecast-svc}
      - targets: ["decision-svc:8103"]
        labels: {service: decision-svc}
      - targets: ["cognitive-svc:8104"]
        labels: {service: cognitive-svc}
      - targets: ["gateway-svc:8080"]
        labels: {service: gateway-svc}
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
